version: '3.8'

services:
  web:
    image: nginx
    ports:
      - 82:80
    volumes:
      - ./Docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html
    depends_on:
      - php-fpm

  php-fpm:
    container_name: php-fpm
    build: ./Docker/php
    volumes:
      # Основной код приложения
      - ./:/var/www/html
      # Конфигурация Xdebug
      - ./Docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-xdebug.ini
      # Volume для кэша Composer (ускоряет установку пакетов)
      - composer-cache:/root/.composer/cache
      # Синхронизация composer.json и composer.lock
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      # Сохранение vendor/ между перезапусками
      - ./vendor:/var/www/html/vendor
    environment:
      # В разработке можно включить, в продакшене — off
      XDEBUG_MODE: develop

  postgres:
    image: postgres:13.1
    container_name: postgres_db
    volumes:
      - ./Docker/postgres/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 5437:5432

# Объявляем именованный volume для кэша Composer
volumes:
  composer-cache:


